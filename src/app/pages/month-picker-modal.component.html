<GridLayout [class]="themeClass" verticalAlignment="bottom" (loaded)="dockToBottom($any($event).object)">
  <StackLayout class="modal">
    <Label class="sheet-handle" horizontalAlignment="center"></Label>
    <GridLayout rows="auto" columns="auto, *, auto">
      <Button col="0" [text]="ui.previous" class="mdi nav-btn" [isEnabled]="year() > firstYear" (tap)="year.set(year() - 1)"></Button>
      <Label col="1" [text]="'' + year()" class="month-label"></Label>
      <Button col="2" [text]="ui.next" class="mdi nav-btn" [isEnabled]="year() < lastYear" (tap)="year.set(year() + 1)"></Button>
    </GridLayout>
    <GridLayout rows="auto, auto, auto, auto" columns="*, *, *" class="month-grid">
      @for (m of months(); track m.number) {
        <Button [row]="m.row" [col]="m.col" [text]="m.label" [class]="m.class" (tap)="pick(m.number)"></Button>
      }
    </GridLayout>
    <Button [text]="s.t().budget.currentMonth" class="chip" (tap)="pickCurrent()"></Button>
  </StackLayout>
</GridLayout>
