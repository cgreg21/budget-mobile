<GridLayout rows="auto, *" class="page">
  <ns-header row="0" [title]="s.t().settings.title"></ns-header>
  <ScrollView row="1">
    <StackLayout class="form">
      <Label [text]="s.t().settings.general" class="section-title"></Label>
      <GridLayout columns="*, auto" class="setting" (tap)="pickLanguage()">
        <Label col="0" [text]="s.t().settings.language"></Label>
        <Label col="1" [text]="languageName(s.settings().language)" class="setting-value"></Label>
      </GridLayout>
      <GridLayout columns="*, auto" class="setting" (tap)="pickCurrency()">
        <Label col="0" [text]="s.t().settings.currency"></Label>
        <Label col="1" [text]="s.settings().currency" class="setting-value"></Label>
      </GridLayout>
      <GridLayout columns="*, auto" class="setting" (tap)="pickDateFormat()">
        <Label col="0" [text]="s.t().settings.dateFormat"></Label>
        <Label col="1" [text]="dateFormatName(s.settings().dateFormat)" class="setting-value"></Label>
      </GridLayout>
      <GridLayout columns="*, auto" class="setting" (tap)="pickAmountFormat()">
        <Label col="0" [text]="s.t().settings.amountFormat"></Label>
        <Label col="1" [text]="amountFormatName(s.settings().amountFormat)" class="setting-value"></Label>
      </GridLayout>
      <GridLayout columns="*, auto" class="setting" (tap)="pickTheme()">
        <Label col="0" [text]="s.t().settings.theme"></Label>
        <Label col="1" [text]="themeName(s.settings().theme)" class="setting-value"></Label>
      </GridLayout>

      <Label [text]="s.t().settings.manage" class="section-title"></Label>
      <GridLayout columns="*, auto" class="setting" (tap)="openRecurrences()">
        <Label col="0" [text]="s.t().settings.recurrences"></Label>
        <Label col="1" text="&#x203A;" class="setting-value"></Label>
      </GridLayout>
      <GridLayout columns="*, auto" class="setting" (tap)="openBank()">
        <Label col="0" [text]="s.t().bank.title"></Label>
        <Label col="1" text="&#x203A;" class="setting-value"></Label>
      </GridLayout>

      <Label [text]="s.t().calendar.title" class="section-title"></Label>
      <Label [text]="s.t().calendar.help" textWrap="true" class="row-sub"></Label>
      <GridLayout columns="*, auto" class="setting">
        <Label col="0" [text]="s.t().calendar.enable"></Label>
        <Switch col="1" [checked]="calendarEnabled()" (checkedChange)="calendarEnabled.set($any($event).value)"></Switch>
      </GridLayout>
      <Label [text]="s.t().calendar.url" class="field-label"></Label>
      <TextField [text]="calendarUrl()" hint="https://cloud.example.com/remote.php/dav/calendars/user/budget" keyboardType="url" autocorrect="false" autocapitalizationType="none" class="input" (textChange)="calendarUrl.set($any($event).value)"></TextField>
      <Label [text]="s.t().calendar.username" class="field-label"></Label>
      <TextField [text]="calendarUsername()" autocorrect="false" autocapitalizationType="none" class="input" (textChange)="calendarUsername.set($any($event).value)"></TextField>
      <Label [text]="s.t().calendar.password" class="field-label"></Label>
      <TextField [text]="calendarPassword()" [hint]="calendar.hasPassword() ? s.t().calendar.passwordKept : ''" secure="true" autocorrect="false" autocapitalizationType="none" class="input" (textChange)="calendarPassword.set($any($event).value)"></TextField>
      <Label [text]="calendar.details()" textWrap="true" [class]="'calendar-status calendar-' + calendar.status().state"></Label>
      <Label [text]="calendar.status().message ?? ''" textWrap="true" [class]="calendar.status().state === 'error' ? 'error' : 'row-sub'" [visibility]="calendar.status().message ? 'visible' : 'collapse'"></Label>
      <Label [text]="s.t().calendar.passwordSession" textWrap="true" class="row-sub" [visibility]="passwordPersistent ? 'collapse' : 'visible'"></Label>
      <Button [text]="s.t().calendar.save" class="primary" (tap)="saveCalendar()"></Button>
      <Button [text]="s.t().calendar.test" class="secondary" [isEnabled]="!calendar.busy()" (tap)="testCalendar()"></Button>
      <Button [text]="s.t().calendar.syncNow" class="secondary" [isEnabled]="calendarEnabled() && !calendar.busy()" (tap)="syncCalendar()"></Button>

      <Label [text]="s.t().settings.thresholds" class="section-title"></Label>
      <Label [text]="s.t().settings.thresholdsHelp" textWrap="true" class="row-sub"></Label>
      <Label [text]="s.t().settings.low" class="field-label"></Label>
      <TextField [text]="low()" keyboardType="decimal" class="input" (blur)="low.set(s.normalizeInput(low()))" (textChange)="low.set($any($event).value)"></TextField>
      <Label [text]="s.t().settings.medium" class="field-label"></Label>
      <TextField [text]="medium()" keyboardType="decimal" class="input" (blur)="medium.set(s.normalizeInput(medium()))" (textChange)="medium.set($any($event).value)"></TextField>
      <Label [text]="s.t().settings.high" class="field-label"></Label>
      <TextField [text]="high()" keyboardType="decimal" class="input" (blur)="high.set(s.normalizeInput(high()))" (textChange)="high.set($any($event).value)"></TextField>
      <Label [text]="message()" textWrap="true" class="error" [visibility]="message() ? 'visible' : 'collapse'"></Label>
      <Button [text]="s.t().common.save" class="primary" (tap)="saveThresholds()"></Button>
    </StackLayout>
  </ScrollView>
</GridLayout>
