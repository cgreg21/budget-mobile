<GridLayout rows="auto, *" class="page">
  <ActionBar row="0" [title]="s.t().recurrences.title">
    <NavigationButton [text]="s.t().common.back" android.systemIcon="ic_menu_back" (tap)="router.back()"></NavigationButton>
  </ActionBar>
  <ScrollView row="1">
    <StackLayout class="form">
      @for (r of b.recurrences(); track r.id) {
        <GridLayout columns="*, auto" class="setting">
          <StackLayout col="0">
            <Label [text]="r.description || s.t().common.noDescription" class="row-title"></Label>
            <Label [text]="details(r)" textWrap="true" class="row-sub"></Label>
          </StackLayout>
          <Label col="1" [text]="signed(r)" [class]="'row-amount ' + r.kind" verticalAlignment="middle"></Label>
        </GridLayout>
        <Button [text]="s.t().common.delete" class="danger compact" (tap)="remove(r)"></Button>
      } @empty {
        <Label [text]="s.t().recurrences.empty" textWrap="true" class="empty-text"></Label>
      }
    </StackLayout>
  </ScrollView>
</GridLayout>
