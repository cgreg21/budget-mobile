<GridLayout rows="auto, *" class="page">
  <ns-header row="0" [title]="s.t().stats.history"></ns-header>

  <GridLayout row="1" rows="auto, auto, *">
    <GridLayout row="0" rows="*" columns="*, *" class="range-row">
      <GridLayout col="0" rows="*" columns="auto, *" class="select" (tap)="choose('start')">
        <Label col="0" [text]="s.t().stats.fromMonth" class="row-sub select-caption" verticalAlignment="middle"></Label>
        <Label col="1" [text]="s.monthLabel(start())" verticalAlignment="middle"></Label>
      </GridLayout>
      <GridLayout col="1" rows="*" columns="auto, *" class="select" (tap)="choose('end')">
        <Label col="0" [text]="s.t().stats.toMonth" class="row-sub select-caption" verticalAlignment="middle"></Label>
        <Label col="1" [text]="s.monthLabel(end())" verticalAlignment="middle"></Label>
      </GridLayout>
    </GridLayout>

    <ns-monthly-lines row="1" [rows]="rows()"></ns-monthly-lines>

    <ScrollView row="2">
      <StackLayout class="stat-list">
        @for (row of history(); track row.month) {
          <StackLayout class="row" (tap)="open(row.month)">
            <GridLayout columns="56, *, auto" rows="auto">
              <Label col="0" [text]="ui.calendar" class="mdi row-icon"></Label>
              <StackLayout col="1" verticalAlignment="middle">
                <Label [text]="s.monthLabel(row.month)" class="row-title" textWrap="false"></Label>
                <Label [text]="s.formatSigned('income', row.income) + '  ·  ' + s.formatSigned('expense', row.expense)" class="row-sub"></Label>
              </StackLayout>
              <Label col="2" [text]="s.formatAmount(row.income - row.expense)" [class]="'row-amount ' + (row.income >= row.expense ? 'income' : 'expense')" verticalAlignment="middle"></Label>
            </GridLayout>
            <GridLayout [columns]="row.columns" rows="auto" class="bar-track row-bar">
              <StackLayout col="0" class="bar income-bar"></StackLayout>
              <StackLayout col="1" class="bar expense-bar"></StackLayout>
            </GridLayout>
          </StackLayout>
        }
      </StackLayout>
    </ScrollView>
  </GridLayout>
</GridLayout>
