name: Bump version

# Increments the patch number (x.y.Z) after every push to master. The commit is made with the
# default GITHUB_TOKEN, which does not start further workflows, so this cannot loop.
on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: bump-version

jobs:
  bump:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # package.json is the source of truth for the app (src/app/app-info.ts reads it); the native
      # projects carry their own copy of the number.
      - name: Increment the patch version
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionName \".*\"/versionName \"${VERSION}\"/" App_Resources/Android/app.gradle
          sed -i "/CFBundleShortVersionString/{n;s#<string>.*</string>#<string>${VERSION}</string>#}" App_Resources/iOS/Info.plist
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json App_Resources/Android/app.gradle App_Resources/iOS/Info.plist
          git commit -m "chore: bump version to ${VERSION} [skip ci]"
          git pull --rebase
          git push
